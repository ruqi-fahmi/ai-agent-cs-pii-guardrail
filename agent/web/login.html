<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · CS Agent PII Guardrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Token warna disalin dari index.html supaya halaman ini tidak terasa nyasar. */
  :root {
    --bg: #090a0f;
    --card: #131724;
    --line: #1c2132;
    --text: #f0f3f8;
    --faint: #525a6e;
    --red: #e3242b;
    --red-glow: rgba(227, 36, 43, 0.35);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    display: grid; place-items: center; padding: 24px;
    /* Dua sorotan lembut supaya latar hitam tidak terasa mati. */
    background-image:
      radial-gradient(720px 360px at 18% -10%, rgba(227, 36, 43, 0.15), transparent 62%),
      radial-gradient(640px 320px at 86% 110%, rgba(56, 189, 248, 0.10), transparent 62%);
  }

  .wrap { display: grid; justify-items: center; gap: 40px; width: 100%; max-width: 348px; }

  /* Logo + denyut pelan: satu-satunya gerakan di halaman, menahannya tetap hidup. */
  .mark { position: relative; display: grid; place-items: center; }
  .mark::before {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 1px solid rgba(227, 36, 43, 0.22); animation: denyut 3.6s ease-out infinite;
  }
  @keyframes denyut {
    0%   { transform: scale(0.88); opacity: 0; }
    35%  { opacity: 1; }
    100% { transform: scale(1.32); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .mark::before { animation: none; opacity: .5; } }

  /* Satu baris: mata - kolom password - tombol panah. */
  form {
    display: flex; align-items: center; gap: 4px; width: 100%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 5px 5px 6px;
    transition: border-color .18s, box-shadow .18s, transform .05s;
  }
  form:focus-within { border-color: rgba(227, 36, 43, 0.5); box-shadow: 0 0 0 4px rgba(227, 36, 43, 0.1); }

  input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 15px;
    letter-spacing: 3px; padding: 12px 4px; text-align: center;
  }
  input::placeholder { color: var(--faint); letter-spacing: 5px; }

  .ikon {
    flex: none; background: transparent; border: 0; cursor: pointer; color: var(--faint);
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    transition: color .15s, background .15s;
  }
  .ikon:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

  .masuk {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: linear-gradient(135deg, #ff3b47, var(--red)); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 20px var(--red-glow);
    transition: filter .15s, transform .08s, opacity .15s;
  }
  .masuk:hover:not(:disabled) { filter: brightness(1.1); }
  .masuk:active:not(:disabled) { transform: scale(0.94); }
  .masuk:disabled { opacity: .45; cursor: default; box-shadow: none; }

  /* Password salah ditandai getaran + garis merah, bukan kalimat. */
  form.salah { border-color: var(--red); animation: getar .4s; }
  @keyframes getar {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-7px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(2px); }
  }
  @media (prefers-reduced-motion: reduce) { form.salah { animation: none; } }

  /* Putaran saat menunggu jawaban server. */
  .putar { animation: putar .7s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }

  /* Terbaca pembaca layar, tak terlihat di layar: getaran saja tidak cukup
     bagi yang tidak melihatnya. */
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="mark">
    <svg width="60" height="60" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3b47"/>
          <stop offset="55%" stop-color="#e3242b"/>
          <stop offset="100%" stop-color="#990b13"/>
        </linearGradient>
        <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="silverRim" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <path d="M16 2.8 L27.5 7.2 V15.5 C27.5 22.8 22 27.8 16 29.8 C10 27.8 4.5 22.8 4.5 15.5 V7.2 L16 2.8Z"
            fill="url(#shieldGrad)" stroke="url(#silverRim)" stroke-width="1" stroke-linejoin="round"/>
      <path d="M16 5.5 L24.8 8.9 V15.2 C24.8 21.2 20.4 25.4 16 27.2 C11.6 25.4 7.2 21.2 7.2 15.2 V8.9 L16 5.5Z"
            fill="#0b0e17" opacity="0.92"/>
      <path d="M16 7.5 V11.5 M16 20.5 V25 M9.5 16 H12.5 M19.5 16 H22.5"
            stroke="url(#cyberBlue)" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
      <circle cx="16" cy="11.5" r="1.3" fill="#38bdf8"/>
      <circle cx="10.5" cy="16" r="1.3" fill="#38bdf8"/>
      <circle cx="21.5" cy="16" r="1.3" fill="#38bdf8"/>
      <circle cx="16" cy="21" r="1.3" fill="#38bdf8"/>
      <path d="M13 16.2 L15.2 18.4 L19.8 13.8" stroke="#ffffff" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <form id="form" autocomplete="off">
    <button type="button" class="ikon" id="peek" aria-label="Tampilkan password">
      <svg id="mata" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
    </button>

    <input id="pw" type="password" placeholder="••••••" aria-label="Password"
           autocomplete="current-password" autofocus required>

    <button type="submit" class="masuk" id="kirim" aria-label="Masuk">
      <svg id="panah" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/>
      </svg>
    </button>
  </form>

  <p class="sr" id="kabar" role="status" aria-live="polite"></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), pw = $("pw"), kirim = $("kirim"), kabar = $("kabar");

const PANAH = '<path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/>';
const MUTER = '<path d="M12 3a9 9 0 1 0 9 9" opacity="0.9"/>';

$("peek").onclick = () => {
  const lihat = pw.type === "password";
  pw.type = lihat ? "text" : "password";
  $("peek").setAttribute("aria-label", lihat ? "Sembunyikan password" : "Tampilkan password");
  $("mata").style.opacity = lihat ? ".55" : "1";   // status terlihat tanpa perlu teks
  pw.focus();
};

function tolak(pesan) {
  form.classList.remove("salah");
  void form.offsetWidth;            // paksa reflow, kalau tidak animasi tak mengulang
  form.classList.add("salah");
  kabar.textContent = pesan;        // hanya untuk pembaca layar
  pw.select();
}

form.onsubmit = async (e) => {
  e.preventDefault();
  form.classList.remove("salah");
  kabar.textContent = "";
  kirim.disabled = true;
  $("panah").innerHTML = MUTER;
  $("panah").classList.add("putar");
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw.value }),
    });
    if (r.ok) {
      // Ganti, bukan dorong: tombol "kembali" tidak memunculkan halaman login lagi.
      location.replace("/");
      return;
    }
    // Balasan bisa datang dari proxy (HTML), bukan aplikasi -- jangan asal r.json().
    const ct = r.headers.get("content-type") || "";
    const b = ct.includes("application/json") ? await r.json() : {};
    tolak(b.detail || `Gagal masuk (HTTP ${r.status}).`);
  } catch {
    tolak("Tidak bisa menghubungi server.");
  } finally {
    kirim.disabled = false;
    $("panah").classList.remove("putar");
    $("panah").innerHTML = PANAH;
  }
};
</script>
</body>
</html>
