name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            ner_service/requirements.txt

      - name: Install
        run: pip install -r agent/requirements.txt -r ner_service/requirements.txt pytest

      # Test tidak butuh API key: Gemini & NER Service di-mock, model NER dimuat dari repo.
      - name: Unit & contract tests
        run: pytest -q

      # Gerbang kualitas model: gagal kalau model yang di-commit membuat PII bocor
      # di evaluasi end-to-end.
      - name: Guardrail end-to-end (no leak gate)
        run: |
          python scripts/eval_guardrail.py | tee eval.txt
          grep -E '^\| \*\*Total' eval.txt | grep -qF '**0** (0%) |' \
            || (echo "::error::Ada PII yang bocor utuh di eval_guardrail" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Browser sungguhan mengetik di halaman demo; Gemini diganti LLM palsu
      # (CS_AGENT_FAKE_LLM=1) jadi tidak butuh API key.
      - name: Browser tests
        env:
          E2E_BROWSER_CHANNEL: ""
        run: pytest -q -m e2e

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Membuktikan kedua Dockerfile bisa di-build (tanpa push).
      - run: docker build -t ner-service:ci ner_service
      - run: docker build -t cs-agent:ci agent
