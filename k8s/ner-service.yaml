# NER Service: hanya bisa diakses dari DALAM cluster (ClusterIP).
# Agent memanggilnya lewat DNS internal: http://ner-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ner-service
  namespace: pii-guard
  labels: {app: ner-service}
spec:
  replicas: 2                      # 2 pod -> satu mati/di-update, guardrail tetap hidup
  selector:
    matchLabels: {app: ner-service}
  template:
    metadata:
      labels: {app: ner-service}
    spec:
      containers:
        - name: ner-service
          image: REGISTRY/ner-service:1.3.0     # diganti saat deploy, lihat docs/DEPLOY-GKE.md
          ports:
            - containerPort: 8000
          # Angka dari docs/resource-performance.md: model + word vectors 40 MB di disk,
          # RSS ~250 MB; di GKE terukur 267–305 MiB; inferensi 1 thread.
          # Hanya backend spaCy yang dimuat di sini. Kalau NER_INDOBERT_DIR diisi, dua model
          # dimuat sekaligus (~1 GB RSS) dan pod ini akan OOM — naikkan limit dulu ke >=1,5Gi.
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 512Mi}
          # readiness: pod baru menerima traffic SETELAH model selesai dimuat
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          # liveness: pod di-restart otomatis kalau macet
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ner-service
  namespace: pii-guard
spec:
  type: ClusterIP
  selector: {app: ner-service}
  ports:
    - port: 80
      targetPort: 8000
